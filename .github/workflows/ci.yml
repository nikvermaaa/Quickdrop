name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build, Unit Tests & Evals
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover tests

      - name: Start services with Docker Compose
        run: |
          docker compose up --build -d

      - name: Wait for services to become healthy
        run: |
          echo "Waiting for app to become ready on http://localhost:8000/health..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/health | grep -q "ok"; then
              echo "App is healthy and responsive!"
              break
            fi
            echo "Waiting for services ($i/30)..."
            sleep 2
          done

      - name: Run Evals (24 Scenarios)
        run: |
          python evals/run.py http://localhost:8000

      - name: Output container logs on failure
        if: failure()
        run: |
          echo "=== APP LOGS ==="
          docker compose logs app
          echo "=== PAYSWIFT LOGS ==="
          docker compose logs payswift
          echo "=== POSTGRES LOGS ==="
          docker compose logs postgres

      - name: Tear down services
        if: always()
        run: |
          docker compose down -v

